name: Pipeline Branch — Deploy to AWS ECS

on:
  push:
    branches:
      - pipeline

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 012834916544.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: vulnwatch                    
  ECS_CLUSTER: genderize-cluster               
  ECS_SERVICE_API: vulnwatch-api               
  ECS_SERVICE_WORKER: vulnwatch-worker         
  TASK_DEFINITION_API: vulnwatch-api-task      
  TASK_DEFINITION_WORKER: vulnwatch-worker-task

jobs:
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    outputs:
      api-image: ${{ steps.build-api.outputs.image }}
      worker-image: ${{ steps.build-worker.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PIPELINE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PIPELINE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── C# API ────────────────────────────────────────────────────────────
      - name: Build & push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: ./api-dotnet
          dockerfile: ./api-dotnet/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Export API image URI
        id: set-api-image
        run: |
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}" \
            >> $GITHUB_OUTPUT

      # ── Java Worker ───────────────────────────────────────────────────────
      - name: Build & push Worker image
        id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker-java
          dockerfile: ./worker-java/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Export Worker image URI
        id: set-worker-image
        run: |
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-${{ github.sha }}" \
            >> $GITHUB_OUTPUT

  deploy-api:
    name: Deploy API to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PIPELINE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PIPELINE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Pull the current registered task definition so we only patch the image,
      # leaving your secrets/environment/CPU/memory config untouched.
      - name: Download current API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_API }} \
            --query taskDefinition \
            > task-def-api.json

      - name: Inject new API image into task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-api.json
          container-name: vulnwatch-api
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}

      - name: Register & deploy new API task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Waits for the new task to be healthy before marking the step green.
          # If the new container crashes, the deploy fails and ECS keeps the old task running.
          wait-for-service-stability: true

  deploy-worker:
    name: Deploy Worker to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PIPELINE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PIPELINE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current Worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_WORKER }} \
            --query taskDefinition \
            > task-def-worker.json

      - name: Inject new Worker image into task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-worker.json
          container-name: vulnwatch-worker
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:worker-${{ github.sha }}

      - name: Register & deploy new Worker task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_WORKER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true